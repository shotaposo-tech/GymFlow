<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymFlow</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { -webkit-touch-callout: none; -webkit-user-select: none; background: #f1f5f9; color: #1e293b; overflow-x: hidden; font-family: sans-serif; }
        .hidden { display: none !important; }
        .done { opacity: 0.4; filter: grayscale(0.6); }
        .bg-gradient-gym { background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%); }
        .text-gradient-gym { background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-tab { color: #d946ef; border-bottom: 3px solid #d946ef; }
        .logo-font { letter-spacing: 0.15em; font-weight: 900; font-style: italic; }
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="loading-overlay" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
        <div class="text-orange-500 font-bold animate-pulse text-sm tracking-widest uppercase">GymFlow Loading...</div>
    </div>

    <div id="login-overlay" class="hidden fixed inset-0 z-40 bg-white flex flex-col items-center justify-center p-6">
        <div class="w-24 h-24 mb-6 bg-gradient-gym rounded-3xl flex items-center justify-center shadow-xl rotate-12">
            <span class="text-white text-4xl italic font-black -rotate-12">GF</span>
        </div>
        <h1 class="text-5xl font-black mb-10 text-slate-800 italic tracking-tighter text-center leading-none">GYM<br>FLOW</h1>
        <button id="login-btn" class="bg-slate-900 text-white font-bold py-4 px-10 rounded-2xl flex items-center gap-3 active:scale-95 transition-all shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Googleでログイン
        </button>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200 px-4">
            <div class="text-center pt-4 pb-1">
                <h1 class="logo-font text-gradient-gym text-2xl uppercase">GymFlow</h1>
            </div>
            <div class="flex justify-around items-center font-bold h-10">
                <button id="tabA" class="flex-1 h-full active-tab transition-all uppercase tracking-widest text-[10px]">Menu A</button>
                <button id="tabB" class="flex-1 h-full text-slate-400 transition-all uppercase tracking-widest text-[10px]">Menu B</button>
                <button id="tabLog" class="flex-1 h-full text-slate-400 transition-all uppercase tracking-widest text-[10px]">Log</button>
                <button onclick="window.resetChecks()" class="ml-4 bg-slate-100 text-slate-500 text-[8px] px-3 py-1 rounded-full border border-slate-200 active:bg-red-50 transition-all">Reset</button>
            </div>
        </header>
        <main class="p-4 space-y-3" id="menu-content"></main>
        <div id="log-content" class="hidden p-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-slate-800 font-black text-sm mb-4 uppercase italic">Total Volume History (kg)</h3>
                <canvas id="volumeChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, onAuthStateChanged, browserLocalPersistence, setPersistence, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEq0qGFrNvQeBDRffBMXb-m5xa3bPYlMg",
            authDomain: "gymflmw.firebaseapp.com",
            projectId: "gymflmw",
            storageBucket: "gymflmw.firebasestorage.app",
            messagingSenderId: "809437611804",
            appId: "1:809437611804:web:900ad03105f67cf41a9cd9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let cloudData = {};
        let currentMenu = 'A';
        let focusTimer = null;
        let activeTimers = {};
        let myChart = null;

        const menuA = [
            { name: "CHEST PRESS", settings: "Seat:6 / Arm:1", type: "strength" },
            { name: "LAT PULLDOWN", settings: "Standard", type: "strength" },
            { name: "ABDOMINAL CRUNCH", settings: "Seat:5", type: "strength" },
            { name: "TREADMILL", settings: "15min Interval", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];
        const menuB = [
            { name: "LEG PRESS", settings: "Seat:2", type: "strength" },
            { name: "LEG EXTENSION", settings: "Seat:4 / Range:11 / Ankle:L", type: "strength" },
            { name: "TREADMILL", settings: "20min Walking", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];

        document.getElementById('login-btn').onclick = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (e) { alert("Login Error"); }
        };

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('loading-overlay').classList.add('hidden');
            if (user) {
                currentUser = user;
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                await loadData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        async function loadData() {
            if (!currentUser) return;
            const docSnap = await getDoc(doc(db, "users", currentUser.uid));
            if (docSnap.exists()) cloudData = docSnap.data();
            render();
        }

        window.autoSave = async () => {
            if (!currentUser) return;
            const updates = { ...cloudData };
            const menus = [...menuA, ...menuB];
            
            // 現在のメニューの入力を反映
            const currentData = currentMenu === 'A' ? menuA : menuB;
            currentData.forEach((item, idx) => {
                const c = document.getElementById(`check-${idx}`);
                if (!c) return;
                const storageKey = `${currentMenu}_${item.name}`;
                if (item.type === 'strength') {
                    updates[storageKey] = {
                        weight: document.getElementById(`weight-${idx}`).value,
                        r1: document.getElementById(`r1-${idx}`).value,
                        r2: document.getElementById(`r2-${idx}`).value,
                        r3: document.getElementById(`r3-${idx}`).value,
                        done: c.checked
                    };
                } else {
                    updates[storageKey] = { done: c.checked };
                }
            });

            // 合計ボリューム計算 (今日の日付で保存)
            const today = new Date().toISOString().split('T')[0];
            let dailyVolume = 0;
            
            // すべての保存済みデータから「チェックが入っている種目」のボリュームを合算
            Object.keys(updates).forEach(key => {
                const val = updates[key];
                if (val && val.done && val.weight) {
                    const w = parseFloat(val.weight) || 0;
                    const r = (parseInt(val.r1) || 0) + (parseInt(val.r2) || 0) + (parseInt(val.r3) || 0);
                    dailyVolume += (w * r);
                }
            });

            if (!updates.history) updates.history = {};
            updates.history[today] = dailyVolume;

            await setDoc(doc(db, "users", currentUser.uid), updates);
            cloudData = updates;
        };

        window.handleMoveFocus = (el, nextId, currentIdPrefix) => {
            if (focusTimer) clearTimeout(focusTimer);
            if (el.value.length > 0 && (currentIdPrefix === 'r1' || currentIdPrefix === 'r2')) {
                const idx = el.id.split('-')[1];
                window.startTimer(90, idx, true);
            }
            if (el.value.length > 0 && nextId) {
                const nextEl = document.getElementById(nextId);
                if (nextEl) {
                    const delay = el.value.length >= 2 ? 0 : 800; 
                    focusTimer = setTimeout(() => { nextEl.focus(); }, delay);
                }
            }
            window.autoSave();
        };

        window.startTimer = (seconds, idx, isInterval = false) => {
            if (activeTimers[idx]) {
                clearInterval(activeTimers[idx]);
                delete activeTimers[idx];
            }
            let timeLeft = seconds;
            const display = document.getElementById(`timer-display-${idx}`);
            const btn = document.getElementById(`timer-btn-${idx}`);
            if(isInterval) display.parentElement.classList.remove('hidden');
            btn.innerText = isInterval ? "REST" : "HOLDING";
            btn.classList.add('opacity-50');
            activeTimers[idx] = setInterval(() => {
                timeLeft--;
                const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                const secs = String(timeLeft % 60).padStart(2, '0');
                display.innerText = `${mins}:${secs}`;
                if (timeLeft <= 0) {
                    clearInterval(activeTimers[idx]);
                    delete activeTimers[idx];
                    display.innerText = isInterval ? "01:30" : "00:00";
                    btn.innerText = isInterval ? "NEXT SET" : "Finish!";
                    btn.classList.remove('opacity-50');
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        };

        window.resetChecks = async () => {
            if (!confirm("現在のメニューをリセットしますか？")) return;
            const data = currentMenu === 'A' ? menuA : menuB;
            data.forEach(item => {
                const storageKey = `${currentMenu}_${item.name}`;
                if(cloudData[storageKey]) cloudData[storageKey].done = false;
            });
            await setDoc(doc(db, "users", currentUser.uid), cloudData);
            render();
        };

        function render() {
            const container = document.getElementById('menu-content');
            if (currentMenu === 'LOG') {
                container.classList.add('hidden');
                document.getElementById('log-content').classList.remove('hidden');
                renderChart();
                return;
            }
            container.classList.remove('hidden');
            document.getElementById('log-content').classList.add('hidden');

            const data = currentMenu === 'A' ? menuA : menuB;
            container.innerHTML = data.map((item, idx) => {
                const storageKey = `${currentMenu}_${item.name}`;
                const prev = cloudData[storageKey] || {};
                return `
                <section class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm ${prev.done ? 'done' : ''}" id="item-${idx}">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex-1">
                            <h2 class="font-black text-slate-800 text-base tracking-tight uppercase">${item.name}</h2>
                            <p class="text-orange-500 text-[8px] font-bold uppercase tracking-widest">${item.settings}</p>
                        </div>
                        <input type="checkbox" id="check-${idx}" class="w-7 h-7 rounded-full border-2 border-slate-300 transition-all" ${prev.done ? 'checked' : ''} onchange="document.getElementById('item-${idx}').classList.toggle('done', this.checked); window.autoSave();">
                    </div>
                    ${item.type === 'strength' ? `
                        <div class="flex gap-2 mb-2">
                            <div class="w-1/3 bg-slate-50 p-2 rounded-xl border border-slate-100 flex items-center relative">
                                <input type="number" inputmode="decimal" class="w-full bg-transparent text-lg font-black text-purple-600 text-center outline-none" id="weight-${idx}" value="${prev.weight || ''}" onfocus="this.select()" onblur="window.autoSave()">
                                <span class="absolute right-2 text-[7px] text-slate-400 font-bold uppercase">KG</span>
                            </div>
                            <div class="w-2/3 flex gap-1">
                                ${[1,2,3].map(n => `
                                    <input type="number" inputmode="numeric" placeholder="R${n}" class="w-full bg-slate-50 p-2 rounded-xl text-base font-black text-slate-700 text-center border border-slate-100 outline-none" id="r${n}-${idx}" value="${prev['r'+n] || ''}" 
                                    onfocus="this.select()" 
                                    oninput="window.handleMoveFocus(this, ${n < 3 ? `'r${n+1}-${idx}'` : 'null'}, 'r${n}')">
                                `).join('')}
                            </div>
                        </div>
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex justify-between items-center px-4 hidden">
                            <span class="font-mono text-lg font-black text-purple-600" id="timer-display-${idx}">01:30</span>
                            <button id="timer-btn-${idx}" onclick="window.startTimer(90, ${idx}, true)" class="bg-gradient-gym text-white font-black px-4 py-1 rounded-lg uppercase text-[8px] shadow-md active:scale-95 transition-all">Rest</button>
                        </div>
                    ` : (item.type === 'plank' ? `
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex justify-between items-center px-4">
                            <span class="font-mono text-xl font-black text-purple-600" id="timer-display-${idx}">00:${item.duration}</span>
                            <button id="timer-btn-${idx}" onclick="window.startTimer(${item.duration}, ${idx})" class="bg-gradient-gym text-white font-black px-5 py-1.5 rounded-lg uppercase text-[9px] shadow-md active:scale-95 transition-all">Start</button>
                        </div>
                    ` : '')}
                </section>
            `}).join('');
        }

        function renderChart() {
            const ctx = document.getElementById('volumeChart').getContext('2d');
            const history = cloudData.history || {};
            const labels = Object.keys(history).sort();
            const data = labels.map(date => history[date]);

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.map(d => d.split('-').slice(1).join('/')), // MM/DD形式
                    datasets: [{
                        label: 'Volume (kg)',
                        data: data,
                        borderColor: '#d946ef',
                        backgroundColor: 'rgba(217, 70, 239, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#f59e0b',
                        pointBorderColor: '#fff',
                        pointRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, grid: { display: false } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        window.switchMenu = (type) => {
            currentMenu = type;
            document.getElementById('tabA').className = type === 'A' ? 'flex-1 h-full active-tab' : 'flex-1 h-full text-slate-400';
            document.getElementById('tabB').className = type === 'B' ? 'flex-1 h-full active-tab' : 'flex-1 h-full text-slate-400';
            document.getElementById('tabLog').className = type === 'LOG' ? 'flex-1 h-full active-tab' : 'flex-1 h-full text-slate-400';
            render();
        };

        document.getElementById('tabA').onclick = () => window.switchMenu('A');
        document.getElementById('tabB').onclick = () => window.switchMenu('B');
        document.getElementById('tabLog').onclick = () => window.switchMenu('LOG');
    </script>
</body>
</html>
