<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymFlow</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ロゴの配色を反映したカスタムスタイル */
        body { 
            -webkit-touch-callout: none; -webkit-user-select: none; 
            background: #f1f5f9; color: #1e293b; 
            overflow-x: hidden; font-family: 'Inter', sans-serif; 
        }
        .hidden { display: none !important; }
        .done { opacity: 0.5; filter: grayscale(0.5); }
        
        /* ロゴグラデーション */
        .bg-gradient-gym {
            background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%);
        }
        .text-gradient-gym {
            background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .active-tab { 
            color: #d946ef; 
            border-bottom: 3px solid #d946ef; 
        }

        /* チェックボックスのカスタム */
        input[type="checkbox"]:checked {
            background-color: #d946ef;
            border-color: #d946ef;
        }

        .logo-font { letter-spacing: 0.1em; font-weight: 900; font-style: italic; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="loading-overlay" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
        <div class="text-orange-500 font-bold animate-bounce text-sm tracking-widest uppercase">GymFlow Loading...</div>
    </div>

    <div id="login-overlay" class="hidden fixed inset-0 z-40 bg-white flex flex-col items-center justify-center p-6">
        <div class="w-32 h-32 mb-8 bg-gradient-gym rounded-full flex items-center justify-center shadow-2xl">
            <span class="text-white text-4xl italic font-black">GF</span>
        </div>
        <h1 class="text-5xl font-black mb-12 text-slate-800 italic tracking-tighter text-center leading-none">GYM<br>FLOW</h1>
        <button id="login-btn" class="bg-slate-900 text-white font-bold py-4 px-10 rounded-2xl flex items-center gap-3 active:scale-95 transition-all shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Googleでログイン
        </button>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200">
            <div class="text-center pt-4 pb-2">
                <h1 class="logo-font text-gradient-gym text-3xl uppercase">GymFlow</h1>
            </div>
            <div class="flex justify-around items-center font-bold px-4 h-10">
                <button id="tabA" class="flex-1 h-full active-tab transition-all uppercase tracking-widest text-[10px]">Menu A</button>
                <button id="tabB" class="flex-1 h-full text-slate-400 transition-all uppercase tracking-widest text-[10px]">Menu B</button>
                <button onclick="window.resetChecks()" class="ml-4 bg-slate-100 text-slate-500 text-[8px] px-3 py-1 rounded-full border border-slate-200 active:bg-red-50 transition-all">Reset</button>
            </div>
        </header>

        <main class="p-4 space-y-3" id="menu-content"></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, onAuthStateChanged, browserLocalPersistence, setPersistence, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEq0qGFrNvQeBDRffBMXb-m5xa3bPYlMg",
            authDomain: "gymflmw.firebaseapp.com",
            projectId: "gymflmw",
            storageBucket: "gymflmw.firebasestorage.app",
            messagingSenderId: "809437611804",
            appId: "1:809437611804:web:900ad03105f67cf41a9cd9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let cloudData = {};
        let currentMenu = 'A';

        const menuA = [
            { name: "CHEST PRESS", settings: "Seat:6 / Arm:1", type: "strength" },
            { name: "LAT PULLDOWN", settings: "Standard", type: "strength" },
            { name: "ABDOMINAL CRUNCH", settings: "Seat:5", type: "strength" },
            { name: "TREADMILL", settings: "15min Interval", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];
        const menuB = [
            { name: "LEG PRESS", settings: "Seat:2", type: "strength" },
            { name: "LEG EXTENSION", settings: "Seat:4 / Range:11 / Ankle:L", type: "strength" },
            { name: "TREADMILL", settings: "20min Walking", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];

        document.getElementById('login-btn').onclick = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (e) { alert("Login Error"); }
        };

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('loading-overlay').classList.add('hidden');
            if (user) {
                currentUser = user;
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                await loadData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
            }
        });

        async function loadData() {
            if (!currentUser) return;
            const docSnap = await getDoc(doc(db, "users", currentUser.uid));
            if (docSnap.exists()) cloudData = docSnap.data();
            render();
        }

        window.autoSave = async () => {
            if (!currentUser) return;
            const updates = { ...cloudData };
            const data = currentMenu === 'A' ? menuA : menuB;

            data.forEach((item, idx) => {
                const c = document.getElementById(`check-${idx}`);
                if (!c) return;
                
                // メニューごとに個別のキーを作る（例: MenuA_PLANK）
                const storageKey = `${currentMenu}_${item.name}`;
                
                if (item.type === 'strength') {
                    const w = document.getElementById(`weight-${idx}`).value;
                    const r1 = document.getElementById(`r1-${idx}`).value;
                    const r2 = document.getElementById(`r2-${idx}`).value;
                    const r3 = document.getElementById(`r3-${idx}`).value;
                    updates[storageKey] = { weight: w, r1: r1, r2: r2, r3: r3, done: c.checked };
                } else {
                    updates[storageKey] = { done: c.checked };
                }
            });

            await setDoc(doc(db, "users", currentUser.uid), updates);
            cloudData = updates;
        };

        window.resetChecks = async () => {
            if (!confirm("現在のメニューのチェックをリセットしますか？")) return;
            const data = currentMenu === 'A' ? menuA : menuB;
            data.forEach(item => {
                const storageKey = `${currentMenu}_${item.name}`;
                if(cloudData[storageKey]) cloudData[storageKey].done = false;
            });
            await setDoc(doc(db, "users", currentUser.uid), cloudData);
            render();
        };

        function render() {
            const container = document.getElementById('menu-content');
            const data = currentMenu === 'A' ? menuA : menuB;
            container.innerHTML = data.map((item, idx) => {
                // メニュー固有のキーでデータを取得
                const storageKey = `${currentMenu}_${item.name}`;
                const prev = cloudData[storageKey] || {};
                
                return `
                <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm ${prev.done ? 'done' : ''}" id="item-${idx}">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex-1">
                            <h2 class="font-black text-slate-800 text-lg tracking-tight uppercase">${item.name}</h2>
                            <p class="text-orange-500 text-[9px] font-bold uppercase tracking-widest">${item.settings}</p>
                        </div>
                        <input type="checkbox" id="check-${idx}" class="w-7 h-7 rounded-full border-2 border-slate-300 transition-all" ${prev.done ? 'checked' : ''} onchange="document.getElementById('item-${idx}').classList.toggle('done', this.checked); window.autoSave();">
                    </div>
                    ${item.type === 'strength' ? `
                        <div class="flex gap-2">
                            <div class="w-1/3 bg-slate-50 p-2 rounded-xl border border-slate-100 flex items-center relative">
                                <input type="number" class="w-full bg-transparent text-xl font-black text-purple-600 text-center outline-none" id="weight-${idx}" value="${prev.weight || ''}" onblur="window.autoSave()">
                                <span class="absolute right-2 text-[7px] text-slate-400 font-bold">KG</span>
                            </div>
                            <div class="w-2/3 flex gap-1">
                                ${[1,2,3].map(n => `
                                    <input type="number" placeholder="R${n}" class="w-full bg-slate-50 p-2 rounded-xl text-lg font-black text-slate-700 text-center border border-slate-100 outline-none focus:border-orange-300" id="r${n}-${idx}" value="${prev['r'+n] || ''}" oninput="window.autoSave()">
                                `).join('')}
                            </div>
                        </div>
                    ` : (item.type === 'plank' ? `
                        <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex justify-between items-center px-4">
                            <span class="font-mono text-xl font-black text-purple-600">00:${item.duration}</span>
                            <button class="bg-gradient-gym text-white font-black px-5 py-1.5 rounded-lg uppercase text-[9px] shadow-md">Start</button>
                        </div>
                    ` : '')}
                </section>
            `}).join('');
        }

        window.switchMenu = (type) => {
            currentMenu = type;
            document.getElementById('tabA').className = type === 'A' ? 'flex-1 h-full active-tab transition-all' : 'flex-1 h-full text-slate-400 transition-all';
            document.getElementById('tabB').className = type === 'B' ? 'flex-1 h-full active-tab transition-all' : 'flex-1 h-full text-slate-400 transition-all';
            render();
        };

        document.getElementById('tabA').onclick = () => window.switchMenu('A');
        document.getElementById('tabB').onclick = () => window.switchMenu('B');
    </script>
</body>
</html>
