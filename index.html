<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymFlow FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 p-4">

<h1 class="text-xl font-bold mb-4">GymFlow Debug</h1>

<button id="login-btn" class="bg-black text-white px-4 py-2 rounded">Googleログイン</button>

<pre id="debug" class="mt-4 text-xs bg-white p-3 rounded border"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithPopup,
  GoogleAuthProvider,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEq0qGFrNvQeBDRffBMXb-m5xa3bPYlMg",
  authDomain: "gymflmw.firebaseapp.com",
  projectId: "gymflmw",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const TARGET_UID = "v6EmxcVq7ZUntmZ4ldWlOlwybR93";

const debug = document.getElementById("debug");

document.getElementById("login-btn").onclick = async () => {
  await signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (user) => {
  if (!user) return;

  debug.innerText = "ログインUID: " + user.uid + "\n\n";

  const ref = doc(db, "users", TARGET_UID);

  onSnapshot(ref, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      debug.innerText += "🔥 データ取得成功\n\n";
      debug.innerText += JSON.stringify(data, null, 2);
    } else {
      debug.innerText += "❌ ドキュメントが存在しない";
    }
  }, (err) => {
    debug.innerText += "🚨 ERROR:\n" + err.message;
  });
});
</script>

</body>
</html>
