<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymFlow - Overwrite Version</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-touch-callout: none; -webkit-user-select: none; background: #f1f5f9; color: #1e293b; overflow-x: hidden; font-family: sans-serif; }
        .hidden { display: none !important; }
        .done { opacity: 0.4; filter: grayscale(0.6); }
        .bg-gradient-gym { background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%); }
        .text-gradient-gym { background: linear-gradient(135deg, #f59e0b 0%, #d946ef 50%, #7c3aed 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .active-tab { color: #d946ef; border-bottom: 3px solid #d946ef; }
        .logo-font { letter-spacing: 0.15em; font-weight: 900; font-style: italic; }
        input[type="number"] { -moz-appearance: textfield; border: none; outline: none; background: transparent; width: 100%; text-align: center; font-weight: 900; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="loading-overlay" class="fixed inset-0 z-50 bg-white flex items-center justify-center">
        <div class="text-orange-500 font-bold animate-pulse text-sm tracking-widest uppercase">GymFlow Loading...</div>
    </div>

    <div id="login-overlay" class="hidden fixed inset-0 z-40 bg-white flex flex-col items-center justify-center p-6">
        <div class="w-24 h-24 mb-6 bg-gradient-gym rounded-3xl flex items-center justify-center shadow-xl rotate-12">
            <span class="text-white text-4xl italic font-black -rotate-12">GF</span>
        </div>
        <h1 class="text-5xl font-black mb-10 text-slate-800 italic tracking-tighter text-center leading-none">GYM<br>FLOW</h1>
        <button id="login-btn" class="bg-slate-900 text-white font-bold py-4 px-10 rounded-2xl flex items-center gap-3 shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Googleでログイン
        </button>
    </div>

    <div id="app-content" class="hidden">
        <header class="bg-white/90 backdrop-blur-md sticky top-0 z-10 border-b border-slate-200 px-4">
            <div class="text-center pt-4 pb-1">
                <h1 class="logo-font text-gradient-gym text-2xl uppercase">GymFlow</h1>
            </div>
            <div class="flex justify-around items-center font-bold h-10">
                <button id="tabA" class="flex-1 h-full active-tab uppercase tracking-widest text-[10px]">Menu A</button>
                <button id="tabB" class="flex-1 h-full text-slate-400 uppercase tracking-widest text-[10px]">Menu B</button>
                <button onclick="window.resetChecks()" class="ml-4 bg-slate-100 text-slate-500 text-[8px] px-3 py-1 rounded-full border border-slate-200">Reset</button>
            </div>
        </header>
        <main class="p-4 space-y-3" id="menu-content"></main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, onAuthStateChanged, browserLocalPersistence, setPersistence, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAEq0qGFrNvQeBDRffBMXb-m5xa3bPYlMg",
            authDomain: "gymflmw.firebaseapp.com",
            projectId: "gymflmw",
            storageBucket: "gymflmw.firebasestorage.app",
            messagingSenderId: "809437611804",
            appId: "1:809437611804:web:900ad03105f67cf41a9cd9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let cloudData = {};
        let currentMenu = 'A';
        const CORRECT_UID = "v6EmxcVq7ZUntmZ4ldWlOlwybR93";

        const menuA = [
            { name: "CHEST PRESS", settings: "Seat:6 / Arm:1", type: "strength" },
            { name: "LAT PULLDOWN", settings: "Standard", type: "strength" },
            { name: "ABDOMINAL CRUNCH", settings: "Seat:5", type: "strength" },
            { name: "TREADMILL", settings: "15min Interval", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];
        const menuB = [
            { name: "LEG PRESS", settings: "Seat:2", type: "strength" },
            { name: "LEG EXTENSION", settings: "Seat:4 / Range:11 / Ankle:L", type: "strength" },
            { name: "TREADMILL", settings: "20min Walking", type: "cardio" },
            { name: "PLANK", settings: "45s x 2sets", type: "plank", duration: 45 }
        ];

        document.getElementById('login-btn').onclick = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                await signInWithPopup(auth, provider);
            } catch (e) { alert("Login Error"); }
        };

        onAuthStateChanged(auth, async (user) => {
            document.getElementById('loading-overlay').classList.add('hidden');
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                await loadData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
            }
        });

        async function loadData() {
            const docSnap = await getDoc(doc(db, "users", CORRECT_UID));
            if (docSnap.exists()) {
                cloudData = docSnap.data();
            }
            render();
        }

        // 入力のたびに「即座に」変数とDBを両方更新する
        window.fastSave = async (itemName, field, value) => {
            if (!cloudData[itemName]) cloudData[itemName] = {};
            
            // 値を更新
            const finalVal = (field === 'done') ? value : String(value);
            cloudData[itemName][field] = finalVal;

            // Firestoreへその項目のみ上書き保存
            try {
                const itemRef = doc(db, "users", CORRECT_UID);
                await setDoc(itemRef, { [itemName]: cloudData[itemName] }, { merge: true });
            } catch (e) { console.error("Save Error", e); }
        };

        window.resetChecks = async () => {
            if (!confirm("チェックをリセット？")) return;
            const data = currentMenu === 'A' ? menuA : menuB;
            for (let item of data) {
                if (cloudData[item.name]) {
                    cloudData[item.name].done = false;
                    await fastSave(item.name, 'done', false);
                }
            }
            render();
        };

        function render() {
            const container = document.getElementById('menu-content');
            const data = currentMenu === 'A' ? menuA : menuB;
            
            container.innerHTML = data.map((item, idx) => {
                const prev = cloudData[item.name] || {};
                return `
                <section class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm ${prev.done ? 'done' : ''}" id="item-${idx}">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex-1">
                            <h2 class="font-black text-slate-800 text-base uppercase">${item.name}</h2>
                            <p class="text-orange-500 text-[8px] font-bold uppercase">${item.settings}</p>
                        </div>
                        <input type="checkbox" class="w-7 h-7 rounded-full border-2" 
                        ${prev.done ? 'checked' : ''} 
                        onchange="document.getElementById('item-${idx}').classList.toggle('done', this.checked); window.fastSave('${item.name}', 'done', this.checked)">
                    </div>
                    ${item.type === 'strength' ? `
                        <div class="flex gap-2">
                            <div class="w-1/3 bg-slate-50 p-2 rounded-xl border relative">
                                <input type="number" inputmode="decimal" class="text-purple-600 text-lg" 
                                value="${prev.weight || ''}" onfocus="this.select()" 
                                oninput="window.fastSave('${item.name}', 'weight', this.value)">
                                <span class="absolute right-1 bottom-1 text-[6px] text-slate-400 font-bold">KG</span>
                            </div>
                            <div class="w-2/3 flex gap-1">
                                ${[1,2,3].map(n => `
                                    <input type="number" inputmode="numeric" placeholder="R${n}" class="bg-slate-50 p-2 rounded-xl border text-slate-700" 
                                    value="${prev['r'+n] || ''}" onfocus="this.select()" 
                                    oninput="window.fastSave('${item.name}', 'r${n}', this.value)">
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="bg-slate-50 p-2 rounded-xl border text-center text-[10px] font-bold text-slate-400 uppercase">
                            ${item.type === 'plank' ? 'Timer Ready' : 'Cardio Mode'}
                        </div>
                    `}
                </section>
            `}).join('');
        }

        window.switchMenu = (type) => {
            currentMenu = type;
            document.getElementById('tabA').className = type === 'A' ? 'flex-1 h-full active-tab uppercase tracking-widest text-[10px]' : 'flex-1 h-full text-slate-400 uppercase tracking-widest text-[10px]';
            document.getElementById('tabB').className = type === 'B' ? 'flex-1 h-full active-tab uppercase tracking-widest text-[10px]' : 'flex-1 h-full text-slate-400 uppercase tracking-widest text-[10px]';
            render();
        };

        document.getElementById('tabA').onclick = () => window.switchMenu('A');
        document.getElementById('tabB').onclick = () => window.switchMenu('B');
    </script>
</body>
</html>
